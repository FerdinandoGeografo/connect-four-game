<mat-card appearance="outlined" class="outcome">
  <mat-card-content class="outcome__content">
    <p class="heading heading--sm">{{ winnerLabel() }}</p>
    <p class="heading heading--xl">{{ winnerOutcome() }}</p>
    <button
      class="btn btn--small btn--tertiary"
      matButton="filled"
      (click)="playAgainClicked.emit()"
    >
      Play again
    </button>
  </mat-card-content>
</mat-card>
