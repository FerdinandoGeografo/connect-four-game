<mat-icon class="turn__icon" svgIcon="custom:turn-bg" [style.color]="currentPlayer().theme" />
<div class="turn__content" [style.--turn-color]="textColor()">
  <p class="heading heading--sm">
    {{ currentPlayer().turnLabel }}
  </p>
  <p class="heading heading--xl" role="timer">{{ time() }}s</p>
</div>
