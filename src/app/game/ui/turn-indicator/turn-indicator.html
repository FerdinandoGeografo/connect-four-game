<mat-icon class="turn__icon" svgIcon="custom:turn-bg" [style.color]="currentPlayer().theme" />
<div class="turn__content" [style.--turn-color]="currentPlayer().themeText">
  <p class="heading heading--sm">{{ currentPlayer().turnLabel }}</p>
  <p class="heading heading--xl" role="timer">
    {{ time() }}<span aria-hidden="true">s</span
    ><span class="cdk-visually-hidden"> seconds left</span>
  </p>
</div>
