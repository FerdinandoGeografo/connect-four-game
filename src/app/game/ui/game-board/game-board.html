<div class="board__layer board__layer--back" aria-hidden="true"></div>

<div class="board__layer board__layer--discs" aria-hidden="true">
  @if (previewCell(); as preview) {
    <span
      class="board__preview"
      [style.--row]="preview.row"
      [style.--col]="preview.column"
      [style.--preview-color]="currentPlayer().theme"
    ></span>
  }
  @for (cell of cells(); track cell.id) {
    <app-game-cell [cell]="cell" [winIndex]="winIndex(cell)" />
  }
</div>

<div class="board__layer board__layer--front" aria-hidden="true"></div>

<div
  class="board__layer board__layer--columns"
  [style.--focus-color]="currentPlayer().theme"
  role="group"
  aria-label="Game board, 7 columns. Use arrow keys to choose a column and Enter to drop a disc."
  (pointerleave)="onBoardLeave()"
>
  @for (column of columns; track column) {
    <button
      #columnButton
      type="button"
      class="board__column"
      [style.--col]="column"
      [attr.aria-label]="columnLabels()[column]"
      [attr.aria-disabled]="!isColumnEnabled(column)"
      [attr.tabindex]="column === focusableColumn() ? 0 : -1"
      (pointermove)="onColumnPointer(column)"
      (pointerdown)="onColumnPointer(column)"
      (focus)="activeColumn.set(column); focusableColumn.set(column)"
      (blur)="activeColumn.set(null)"
      (keydown)="onKeydown($event, column)"
      (click)="onColumnClick(column)"
    ></button>
  }
</div>

<mat-icon
  class="board__marker"
  svgIcon="custom:marker"
  [class.board__marker--visible]="showMarker()"
  [style.--col]="markerColumn()"
  [style.color]="currentPlayer().theme"
/>
