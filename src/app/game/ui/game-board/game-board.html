<mat-icon
  class="board__marker"
  svgIcon="custom:marker"
  [style.color]="currentPlayer().theme"
  [style.left.px]="markerLeft()"
  [class.board__marker--hidden]="hoveredColumn() === null || phase() !== 'running'"
/>

<img class="board__layer board__layer--front" src="images/board-layer-white-large.svg" alt="" />

<div class="board__layer board__layer--columns">
  @for (col of columns; track col) {
    <button
      class="board__column"
      [disabled]="phase() !== 'running' || !playableColumns().includes(col)"
      (mouseover)="onColumnHover(col)"
      (click)="onColumnClick(col)"
    >
      @for (row of rows; track row) {
        <app-game-cell
          [cells]="cells()"
          [position]="{ row: row, column: col }"
          [currentPlayer]="currentPlayer()"
          [isPreview]="
            phase() === 'running' && previewCell()?.row === row && previewCell()?.column === col
          "
          [winningCells]="winningCells()"
        />
      }
    </button>
  }
</div>

<img class="board__layer board__layer--back" src="images/board-layer-black-large.svg" alt="" />
