<mat-card class="rules" appearance="outlined">
  <mat-card-content class="rules__content">
    <h1 class="heading heading--xl" tabindex="-1">Rules</h1>

    <div class="rules__item">
      <h2 class="rules__title heading heading--md">Objective</h2>
      <p class="rules__text text">
        Be the first player to connect 4 of the same colored discs in a row (either vertically,
        horizontally, or diagonally).
      </p>
    </div>

    <div class="rules__item">
      <h2 class="rules__title heading heading--md">How to play</h2>
      <!-- role="list" keeps the list semantics in Safari despite list-style: none. -->
      <ol class="rules__list text" role="list">
        @for (rule of rules; track rule) {
          <li>
            <span class="rules__number" aria-hidden="true">{{ $index + 1 }}</span>
            <p class="rules__rule">{{ rule }}</p>
          </li>
        }
      </ol>
    </div>
  </mat-card-content>
</mat-card>
<a class="btn rules__back" matIconButton routerLink="/main-menu" aria-label="Back to main menu">
  <mat-icon svgIcon="custom:check" />
</a>
